name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ferramentas que o app lê (lspci, udevadm, lsblk já vêm no runner)
        run: sudo apt-get install -y --no-install-recommends pciutils
      - name: Testes
        run: dotnet test tests --logger "console;verbosity=normal"
